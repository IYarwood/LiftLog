<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LiftLog">
<meta name="theme-color" content="#080b0f">
<title>LiftLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080b0f;
    --surface: #0f1318;
    --card: #141920;
    --border: #1e2530;
    --border-h: #2e3a48;
    --accent: #4af0b0;
    --accent-dim: #1a3d30;
    --accent-t: #2dd896;
    --muted: #3a4a58;
    --text: #c8d8e8;
    --text-d: #5a7080;
    --text-f: #2e3e4e;
    --danger: #ff4455;
    --warn: #f0a030;
    --mono: 'JetBrains Mono', monospace;
    --disp: 'Barlow Condensed', sans-serif;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
    --tabbar-h: 54px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 14px; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; }
  input[type=number] { -moz-appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  input::placeholder { color: var(--text-f); }
  input:focus { outline: none; border-color: var(--accent) !important; }
  button { cursor: pointer; font-family: var(--mono); }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  #nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: var(--bg); border-bottom: 1px solid var(--border);
    padding: calc(var(--safe-top) + 4px) 20px 4px;   /* leaves 44px for button hit areas */
    display: flex; align-items: center; gap: 12px; height: calc(var(--safe-top) + 52px);
  }
  .nav-logo { font-family: var(--disp); font-size: 28px; letter-spacing: 3px; color: var(--accent); font-weight: 700; }
  .nav-spacer { flex: 1; }
  .nav-btn { background: none; border: none; color: var(--text-d); font-size: 11px; padding: 6px 10px; border-radius: 6px; letter-spacing: 0.5px; }
  .nav-btn.active { color: var(--accent-t); }
  .nav-btn:active { background: var(--surface); }
  .nav-btn { flex-shrink: 0; white-space: nowrap; min-height: 44px; min-width: 44px; }
  @media (max-width: 400px) {
    #nav { padding-left: 14px; padding-right: 10px; gap: 2px; }
    .nav-logo { font-size: 24px; letter-spacing: 2px; margin-right: 4px; }
    .nav-btn { padding: 6px 7px; }
  }
  @media (max-width: 360px) {
    .nav-logo { font-size: 22px; letter-spacing: 1.5px; margin-right: 2px; }
    .nav-btn { padding: 6px 6px; letter-spacing: 0; }
  }

  #main {
    flex: 1;
    margin-top: calc(var(--safe-top) + 52px);
    padding-bottom: calc(var(--safe-bot) + 24px + var(--tabbar-h));
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .view { display: none; padding: 20px; animation: fadeIn 0.2s ease; }
  .view.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 10px;
    transition: border-color 0.15s;
  }
  .card:active { border-color: var(--border-h); background: #171e26; }
  .card.clickable { cursor: pointer; }

  .btn-primary {
    width: 100%; background: var(--accent); border: none; border-radius: 10px;
    padding: 16px; font-family: var(--disp); font-size: 22px; letter-spacing: 3px;
    color: var(--bg); font-weight: 700; margin-bottom: 10px;
  }
  .btn-primary:active { opacity: 0.85; }
  .btn-ghost {
    width: 100%; background: none; border: 1px dashed var(--border);
    border-radius: 8px; padding: 10px; color: var(--muted); font-size: 12px;
    margin-top: 6px; letter-spacing: 0.5px;
  }
  .btn-ghost:active { background: var(--surface); }
  .btn-secondary {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; font-family: var(--disp); font-size: 18px;
    letter-spacing: 2px; color: var(--text); margin-bottom: 10px;
  }
  .btn-secondary:active { opacity: 0.8; }

  .section-label { font-size: 9px; color: var(--text-d); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; margin-top: 24px; }

  .disp { font-family: var(--disp); letter-spacing: 1px; }
  .disp-lg { font-family: var(--disp); font-size: 28px; letter-spacing: 2px; margin-bottom: 4px; }
  .disp-md { font-family: var(--disp); font-size: 20px; letter-spacing: 1px; }
  .disp-sm { font-family: var(--disp); font-size: 18px; letter-spacing: 1px; }
  .text-d { color: var(--text-d); font-size: 11px; margin-top: 4px; }
  .text-accent { color: var(--accent-t); }

  .stat-row { display: flex; gap: 16px; margin-top: 8px; }
  .stat-tag { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .stat-label { font-size: 9px; color: var(--text-d); letter-spacing: 1.5px; text-transform: uppercase; }
  .stat-val { font-family: var(--disp); font-size: 18px; letter-spacing: 1px; }

  .pill { background: var(--accent-dim); color: var(--accent-t); border-radius: 4px; padding: 2px 7px; font-size: 10px; letter-spacing: 1px; display: inline-block; margin: 2px; max-width: 100%; line-height: 1.5; }

  /* Exercise names are free text (up to 60 chars, possibly one unbroken word):
     let them break anywhere so they never widen the page. Flex children that
     hold them need min-width:0 or they refuse to shrink below the word. */
  .disp-lg, .disp-md, .disp-sm, .pill, .ex-manage-name, .ex-pick-btn, .ex-create-btn { overflow-wrap: anywhere; word-break: break-word; }
  .flex-fill { flex: 1; min-width: 0; }
  .no-shrink { flex-shrink: 0; }

  /* Fixed columns total 136px (same as before), so the inputs keep their width
     at 320px while save and × get 44px hit areas. */
  .set-headers { display: grid; grid-template-columns: 20px 1fr 1fr 56px 44px; gap: 4px; margin-bottom: 4px; padding: 0 2px; }
  .set-header-cell { font-size: 9px; color: var(--muted); letter-spacing: 1px; text-align: center; }
  .set-row { display: grid; grid-template-columns: 20px 1fr 1fr 56px 44px; gap: 4px; margin-bottom: 6px; align-items: center; }
  .set-num { text-align: center; font-size: 11px; color: var(--muted); }
  .set-num.saved { color: var(--accent-t); }
  .set-input {
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 4px; color: var(--text); font-family: var(--mono); font-size: 16px;
    text-align: center; width: 100%; min-height: 44px; transition: border-color 0.15s;
  }
  .set-input.saved { background: transparent; border-color: transparent; }
  .set-input.invalid { border-color: var(--danger) !important; }
  .set-err { color: var(--danger); font-size: 11px; margin: -2px 0 8px 24px; }
  .set-err:empty { display: none; }
  .set-save-btn {
    background: var(--accent-dim); border: 1px solid rgba(74,240,176,0.2);
    border-radius: 5px; color: var(--accent-t); font-size: 10px; padding: 8px 4px; width: 100%; min-height: 44px;
  }
  .set-save-btn:active { opacity: 0.7; }
  .set-saved-check { text-align: center; font-size: 12px; color: var(--accent-t); }
  .set-del-btn { background: none; border: none; color: var(--text-f); font-size: 18px; text-align: center; width: 100%; min-height: 44px; padding: 4px; }
  .set-del-btn:active { color: var(--danger); }

  @keyframes flash { 0%,100% { background: var(--card); } 35% { background: var(--accent-dim); } }
  .set-flash { animation: flash 1.1s ease; }

  .detail-grid { display: grid; grid-template-columns: 28px 1fr 1fr 1fr; gap: 4px; }
  .detail-head { font-size: 9px; color: var(--muted); letter-spacing: 1px; text-align: center; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .detail-cell { font-size: 13px; text-align: center; padding: 8px 4px; border-bottom: 1px solid var(--border); }
  .detail-cell.accent { color: var(--accent-t); font-weight: 500; }
  .detail-cell.dim { color: var(--text-d); font-size: 10px; }

  #overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; height: 100%; background: rgba(0,0,0,0.7);
    z-index: 200; flex-direction: column; justify-content: flex-end;
  }
  #overlay.open { display: flex; }
  #overlay-sheet {
    background: var(--surface); border-top: 1px solid var(--border);
    border-radius: 16px 16px 0 0; padding: 20px;
    padding-bottom: calc(var(--safe-bot) + 20px);
    max-height: min(72vh, 92%); overflow-y: auto;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }

  .ex-pick-btn {
    width: 100%; background: none; border: none; border-bottom: 1px solid var(--border);
    padding: 13px 4px; color: var(--text); font-family: var(--mono); font-size: 13px;
    text-align: left; letter-spacing: 0.3px;
  }
  .ex-pick-btn:active { background: var(--card); }
  .ex-create-btn {
    width: 100%; background: var(--accent-dim); border: 1px solid rgba(74,240,176,0.25);
    border-radius: 8px; padding: 12px 14px; color: var(--accent-t); font-family: var(--mono);
    font-size: 13px; text-align: left; margin-bottom: 8px; letter-spacing: 0.3px;
  }
  .ex-create-btn:active { opacity: 0.75; }

  .ex-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .ex-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 12px; }
  .ex-del { flex-shrink: 0; background: none; border: none; color: var(--text-f); font-size: 20px; line-height: 1; padding: 2px 6px; min-width: 44px; min-height: 44px; }
  .ex-del:active { color: var(--danger); }
  /* "already in this workout" — briefly highlight the existing card */
  @keyframes cardflash { 0%,100% { border-color: var(--border); box-shadow: none; } 25%,60% { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); } }
  .ex-flash { animation: cardflash 1.6s ease; }

  .ex-manage-row { display: flex; align-items: center; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--border); min-height: 52px; }
  .ex-manage-name { flex: 1; min-width: 0; font-size: 13px; color: var(--text-d); }
  .ex-manage-row .mini-btn { padding: 0 10px; }
  .ex-edit-input {
    flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 10px; color: var(--text); font-family: var(--mono); font-size: 16px;
  }
  .ex-add-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .ex-add-row .search-input { flex: 1; min-width: 0; margin-bottom: 0; }
  .ex-add-row .mini-btn { height: auto; min-height: 44px; min-width: 44px; }

  .search-input {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 11px 14px; color: var(--text); font-family: var(--mono);
    font-size: 16px; margin-bottom: 14px;
  }

  #in-progress-banner { display: none; }
  #in-progress-banner.visible { display: block; }

  .loading { text-align: center; padding: 40px 0; color: var(--text-d); font-size: 12px; }

  /* Bottom tab bar (top-level sections) */
  #tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
    background: var(--bg); border-top: 1px solid var(--border);
    display: flex; padding-bottom: var(--safe-bot);
  }
  .tab-btn {
    flex: 1; min-width: 0; height: var(--tabbar-h); background: none; border: none;
    color: var(--text-d); font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    position: relative;
  }
  .tab-btn.active { color: var(--accent-t); }
  .tab-btn.active::before { content: ''; position: absolute; top: -1px; left: 25%; right: 25%; height: 2px; background: var(--accent); border-radius: 0 0 2px 2px; }
  .tab-btn:active { background: var(--surface); }
  .tab-badge {
    position: absolute; top: 7px; left: calc(50% + 20px);
    min-width: 16px; height: 16px; line-height: 16px; padding: 0 4px;
    border-radius: 8px; background: var(--accent); color: var(--bg);
    font-size: 9px; letter-spacing: 0; font-weight: 500; text-align: center;
  }

  /* Friends */
  .who { color: var(--accent-t); font-size: 11px; letter-spacing: 0.5px; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .friend-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--border); min-height: 52px; }
  .friend-name { flex: 1; min-width: 0; font-size: 14px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .friend-name.clickable { cursor: pointer; }
  .friend-name .sub { display: block; font-size: 10px; color: var(--text-d); margin-top: 2px; }
  .mini-btn {
    flex-shrink: 0; background: none; border: 1px solid var(--border); border-radius: 6px;
    color: var(--text-d); font-size: 11px; letter-spacing: 0.5px; padding: 0 12px; height: 44px; min-width: 44px;
  }
  .mini-btn.accent { background: var(--accent-dim); border-color: rgba(74,240,176,0.25); color: var(--accent-t); }
  .mini-btn.danger:active { color: var(--danger); border-color: var(--danger); }
  .mini-btn:active { opacity: 0.75; }
  .mini-btn:disabled { opacity: 0.5; }
  .mini-tag { flex-shrink: 0; font-size: 10px; color: var(--text-d); letter-spacing: 0.5px; padding: 0 4px; }
  .empty { text-align: center; padding: 28px 0; color: var(--text-d); font-size: 12px; }
  .form-msg { font-size: 11px; color: var(--text-d); min-height: 16px; margin: -6px 0 8px; }
  .form-msg.err { color: var(--danger); }

  /* Editing a finished workout */
  .edited-tag {
    display: inline-block; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--warn);
    border: 1px solid rgba(240,160,48,0.35); border-radius: 4px; padding: 0 5px; margin-left: 6px;
    line-height: 15px; vertical-align: middle; white-space: nowrap;
  }
  .edit-closed { font-size: 10px; color: var(--text-d); letter-spacing: 0.5px; padding: 14px 0 0; white-space: nowrap; }
  .edit-set-row { display: grid; grid-template-columns: 20px 1fr 1fr 44px; gap: 4px; margin-bottom: 6px; align-items: center; }
  .btn-danger {
    width: 100%; background: none; border: 1px solid rgba(255,68,85,0.4); border-radius: 10px;
    padding: 14px; min-height: 48px; font-family: var(--disp); font-size: 18px; letter-spacing: 2px;
    color: var(--danger); margin: 18px 0 10px;
  }
  .btn-danger:active { background: rgba(255,68,85,0.1); }

  /* Five tabs at 320px are 64px wide: keep the friends badge inside its tab. */
  @media (max-width: 360px) {
    .tab-badge { left: auto; right: 3px; top: 4px; }
  }

  /* Leaderboard */
  .seg { display: flex; gap: 3px; padding: 3px; margin: 12px 0 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  .seg-btn {
    flex: 1; min-width: 0; min-height: 44px; background: none; border: none; border-radius: 7px;
    color: var(--text-d); font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
  }
  .seg-btn.active { background: var(--accent-dim); color: var(--accent-t); }
  .seg-btn:active { opacity: 0.75; }
  .lb-period { font-size: 12px; color: var(--text); margin-bottom: 2px; }
  .lb-rules { font-size: 10px; color: var(--text-d); line-height: 1.5; margin-bottom: 14px; }
  .lb-row {
    width: 100%; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 10px 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px;
    color: var(--text); font-size: 14px; text-align: left;
  }
  .lb-row:active { border-color: var(--border-h); }
  .lb-row.you { border-color: rgba(74,240,176,0.4); background: #0f1f19; }
  .lb-row.open { border-radius: 10px 10px 0 0; margin-bottom: 0; }
  .lb-rank { flex-shrink: 0; width: 26px; text-align: center; font-family: var(--disp); font-size: 20px; color: var(--text-d); }
  .lb-rank.first { color: var(--accent-t); }
  .lb-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-name .sub { display: block; font-size: 10px; color: var(--text-d); margin-top: 2px; white-space: normal; overflow-wrap: anywhere; }
  .lb-name .lb-you { color: var(--accent-t); letter-spacing: 1px; }
  .lb-pts { flex-shrink: 0; font-family: var(--disp); font-size: 22px; letter-spacing: 1px; }
  .lb-pts small { font-family: var(--mono); font-size: 9px; color: var(--text-d); letter-spacing: 0.5px; margin-left: 2px; }
  .lb-chev { flex-shrink: 0; color: var(--text-f); font-size: 16px; }
  .lb-ex-name { display: block; font-family: var(--disp); font-size: 18px; letter-spacing: 1px; overflow-wrap: anywhere; word-break: break-word; }
  .lb-detail {
    margin-bottom: 8px; padding: 4px 12px 8px; background: var(--surface);
    border: 1px solid var(--border); border-top: none; border-radius: 0 0 10px 10px;
  }
  .lb-line { display: flex; align-items: flex-start; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  .lb-line:last-child { border-bottom: none; }
  .lb-line.you { color: var(--accent-t); }
  .lb-line.unverified { opacity: 0.45; }
  .lb-unv { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-d); border: 1px solid var(--border-h); border-radius: 4px; padding: 0 5px; margin-left: 6px; white-space: nowrap; }
  .lb-line .main { flex: 1; min-width: 0; overflow-wrap: anywhere; word-break: break-word; }
  .lb-line .sub { display: block; font-size: 10px; color: var(--text-d); margin-top: 2px; }
  .lb-line .val { flex-shrink: 0; font-family: var(--disp); font-size: 17px; letter-spacing: 1px; text-align: right; }
  .lb-line .val.zero { color: var(--text-d); }
  .lb-cta { text-align: center; padding: 18px 12px; margin-bottom: 14px; }
  .lb-cta .btn-secondary { margin: 12px 0 0; min-height: 44px; }
</style>
</head>
<body>

<nav id="nav">
  <span class="nav-logo">LIFTLOG</span>
  <span class="nav-spacer"></span>
  <button class="nav-btn" id="btn-back" onclick="goBack()" style="display:none">← back</button>
  <button class="nav-btn" id="btn-exercises" onclick="openManage()">exercises</button>
  <button class="nav-btn" id="btn-logout" onclick="logout()">log out</button>
</nav>

<div id="main">

  <!-- HOME -->
  <div class="view active" id="view-home">
    <div id="in-progress-banner" class="card clickable" onclick="showView('workout')" style="border-color: rgba(74,240,176,0.3); margin-bottom:16px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
        <div class="flex-fill">
          <span class="pill">IN PROGRESS</span>
          <div class="disp-md" id="banner-title" style="margin-top:8px;"></div>
          <div class="text-d" id="banner-sub"></div>
        </div>
        <span class="no-shrink" style="color:var(--accent); font-size:20px;">→</span>
      </div>
    </div>

    <button class="btn-primary" id="start-btn" onclick="startSession()">START WORKOUT</button>

    <div class="section-label" id="recent-label" style="display:none;">recent sessions</div>
    <div id="recent-list"></div>
  </div>

  <!-- WORKOUT -->
  <div class="view" id="view-workout">
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;">
      <div class="disp-lg" id="workout-title"></div>
      <span class="text-d" id="workout-time"></span>
    </div>
    <div class="text-d" id="workout-sub" style="margin-bottom:20px;"></div>
    <div id="exercises-list"></div>
    <button class="btn-secondary" onclick="openOverlay()">+ ADD EXERCISE</button>
    <button class="btn-primary" onclick="finishSession()" style="margin-top:4px; background:var(--accent);">FINISH WORKOUT</button>
  </div>

  <!-- HISTORY -->
  <div class="view" id="view-history">
    <div class="disp-lg">HISTORY</div>
    <div id="history-list"></div>
  </div>

  <!-- SESSION DETAIL -->
  <div class="view" id="view-session-detail">
    <div class="who" id="detail-who" style="display:none"></div>
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
      <div class="disp-lg flex-fill" id="detail-title"></div>
      <div class="no-shrink" id="detail-actions"></div>
    </div>
    <div class="text-d" style="margin-bottom:20px;"><span id="detail-sub"></span><span id="detail-edited"></span></div>
    <div id="detail-exercises"></div>
    <div id="detail-footer"></div>
  </div>

  <!-- FEED (friends' finished workouts) -->
  <div class="view" id="view-feed">
    <div class="disp-lg">FEED</div>
    <div class="text-d" style="margin-bottom:16px;">your friends' finished workouts</div>

      autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" style="display:none"
      oninput="renderLeaderboard()" onkeydown="if(event.key==='Enter'){this.blur();}">

    <div class="disp-lg">EXERCISES</div>
    <div class="text-d" style="margin-bottom:16px;">add, rename or remove — this list is shared by everyone. Past workouts keep the name they were logged with.</div>
    <div class="ex-add-row">
      <input class="search-input" id="manage-new" type="text" maxlength="60" placeholder="new exercise..."
        autocomplete="off" enterkeyhint="done" onkeydown="manageNewKey(event)">
      <button class="mini-btn accent" onclick="addLibraryExercise()">add</button>

    <div class="disp-sm" style="font-size:22px; letter-spacing:2px;">ADD EXERCISE</div>
    <input class="search-input" id="ex-filter" maxlength="60" placeholder="search or type new..." oninput="renderOverlay()" style="margin-top:12px;">

    <div id="ex-list"></div>

<script type="module">
import { api, GET, POST, PATCH, DELETE, getToken, clearToken } from './js/api.js?v=dev';
import { createSaveQueue } from './js/saveQueue.js?v=dev';
import { SET_LIMITS_MSG, setFieldError, setErrorText, fieldSaveValue } from './js/setFields.js?v=dev';

// ─── State ────────────────────────────────────────────────────────────────────
let exercises = [];   // string[]
let sessions  = [];   // completed Session[]
let active    = null; // active Session | null
let currentView = 'home';
let detailSession = null;
let detailOwner = null;      // null = my session; username = a friend's (read-only)
let detailReturn = 'history'; // view to go back to from session detail
let detailEditing = false;    // my finished workout is open in edit mode
let manageReturn = 'home';    // view to go back to from the exercises page
let manageEditing = null;     // library name currently being renamed, or null
let manageDraft = '';         // text in the rename input (survives re-renders)

// Friends state
let friendsData = { friends: [], incoming: [], outgoing: [] };
let searchResults = [];
let feedItems = [], feedCursor = null;
let fhUser = null, fhItems = [], fhCursor = null;
const TAB_VIEWS = ['home', 'history', 'feed', 'friends', 'leaderboard'];

// ─── Helpers ──────────────────────────────────────────────────────────────────
function uid() { return '_' + Math.random().toString(36).slice(2) + Date.now().toString(36); }
function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
}
function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
}
function totalSavedSets(sess) {
  return (sess.exercises||[]).reduce((a,e) => a + (e.sets||[]).filter(s=>s.savedAt).length, 0);
}
function exerciseStats(exName) {
  const allSets = sessions.flatMap(s =>
    (s.exercises||[]).filter(e=>e.name===exName).flatMap(e=>(e.sets||[]))
  ).filter(s => s.weight > 0);
  if (!allSets.length) return null;
  const weights = allSets.map(s => Number(s.weight));
  return {
    maxWeight: Math.max(...weights),
    avgWeight: Math.round(weights.reduce((a,b)=>a+b,0) / weights.length)
  };
}
function el(id) { return document.getElementById(id); }
// Exercise names match ignoring case everywhere ("Squat" == "squat"): the
// library, the add sheet, and one-exercise-per-workout. The server compares
// with lower(), and stores names trimmed.
const sameName = (a, b) => String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
// The active workout's entry for `name` (any casing), or undefined.
function workoutExercise(name) {
  return (active?.exercises || []).find(e => sameName(e.name, name));
}
// Escape anything user-controlled before it goes into innerHTML. Friends'
// exercise names / usernames are other people's input, so this matters.
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
// A string argument for an inline handler, e.g. onclick="fn(${jsArg(id)})".
// JSON.stringify makes it a valid JS string literal (quotes/backslashes escaped);
// esc() then makes that literal safe inside the double-quoted HTML attribute
// (the browser decodes the entities before the JS runs). Prefer data-* attributes
// plus a delegated listener for anything that is a free-text name.
function jsArg(v) { return esc(JSON.stringify(String(v ?? ''))); }

// ─── Navigation ───────────────────────────────────────────────────────────────
function showView(name, opts = {}) {
  // Leaving the exercises page: drop its status/error and any half-done rename.
  if (currentView === 'manage' && name !== 'manage') { manageMsg(''); manageEditing = null; }
  if (currentView === 'session-detail' && name !== 'session-detail' && detailEditing) {
    detailEditing = false;
    editSaves.flushAll();   // send anything typed in the last 600ms
  }
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  el('view-' + name).classList.add('active');
  currentView = name;
  el('btn-back').style.display = TAB_VIEWS.includes(name) ? 'none' : '';
  // Sub-views keep their parent tab highlighted
  const tab = name === 'session-detail' ? (TAB_VIEWS.includes(detailReturn) ? detailReturn : 'friends')
    : name === 'friend-history' ? 'friends'
    : name === 'manage' ? null   // opened from the top bar, not a tab
    : TAB_VIEWS.includes(name) ? name : 'home';
  TAB_VIEWS.forEach(t => el('tab-' + t).classList.toggle('active', t === tab));
  el('btn-exercises').classList.toggle('active', name === 'manage');
  if (name === 'home') renderHome();
  if (name === 'feed') { if (opts.keep && feedItems.length) renderFeed(); else loadFeed(true); }
  if (name === 'friends') loadFriends();
  if (name === 'friend-history') renderFriendHistory();
  if (name === 'history') renderHistory();
  if (name === 'workout') renderWorkout();
  if (name === 'session-detail') renderDetail();
  if (name === 'manage') loadManage();
  if (name === 'leaderboard') loadLeaderboard();
  window.scrollTo(0, 0);
}
function goBack() {
  if (currentView === 'session-detail') { showView(detailReturn, { keep: true }); return; }
  if (currentView === 'friend-history') { showView('friends'); return; }
  if (currentView === 'manage') { showView(manageReturn, { keep: true }); return; }
  showView('home');
}

function logout() {
  clearToken();
  window.location.href = '/login.html';
}

// ─── Init ─────────────────────────────────────────────────────────────────────
async function init() {
  try {
    [exercises, sessions, active] = await Promise.all([
      GET('/exercises'),
      GET('/sessions'),
      GET('/sessions/active'),
    ]);
    renderHome();
    refreshFriendsBadge();
  } catch (err) {
    console.error('Init failed:', err);
    el('recent-list').innerHTML = `<div class="loading">could not connect to server</div>`;
  }
}

// ─── Session lifecycle ────────────────────────────────────────────────────────
async function startSession() {
  if (active) { showView('workout'); return; }
  const id = uid();
  const startedAt = new Date().toISOString();
  await POST('/sessions', { id, startedAt });
  active = { id, startedAt, exercises: [] };
  showView('workout');
}

let finishing = false;   // a second tap while the first is still saving does nothing
async function finishSession() {
  if (!active || finishing) return;
  finishing = true;
  try {
    const sess = active;
    // Out-of-range values are never sent; make the user fix them first.
    const bad = firstInvalidSet();
    if (bad) {
      focusExerciseCard(bad.exId);
      alert(`Fix the highlighted set value before finishing.\n${SET_LIMITS_MSG}`);
      return;
    }
    // Saves for sets/exercises that no longer exist can't succeed: forget them.
    setSaves.dropWhere(t => !setExists(t));
    // Edits typed in the last 600ms are still waiting to be sent: send them
    // (and wait) before the session is closed, or they'd be lost.
    if (!(await setSaves.flushAll()) &&
        !confirm('Some set changes could not be saved. Finish anyway?')) {
      return;
    }
    await PATCH(`/sessions/${sess.id}/finish`);
    setSaves.dropWhere(t => t.sessionId === sess.id);   // finished: stop retrying
    sessions = [{ ...sess, finishedAt: new Date().toISOString() }, ...sessions];
    active = null;
    showView('home');
  } finally {
    finishing = false;
  }
}

// ─── Exercise management in session ──────────────────────────────────────────
// Server caps names at 60 chars (backend/src/validation/exerciseName.js).
const EXERCISE_NAME_MSG = 'Exercise names must be 1–60 characters.';
const DOTS_MSG = 'Exercise names can\'t be only dots.';
// Message for a 400 on a name: the dots rule has its own wording.
function nameErrorMsg(err) {
  return err && err.body && /dots/.test(err.body.error || '') ? DOTS_MSG : EXERCISE_NAME_MSG;
}

async function addExerciseToSession(name) {
  if (!active) return;
  name = String(name || '').trim();   // match what the server stores
  // Already in this workout (any casing)? Jump to it instead of adding a second card.
  const existing = workoutExercise(name);
  if (existing) { closeOverlay(); focusExerciseCard(existing.id); return; }
  const id = uid();
  const position = active.exercises.length;
  try {
    await POST(`/sessions/${active.id}/exercises`, { id, name, position });
  } catch (err) {
    if (err.status === 409 && err.body && err.body.id) {
      // The server already has it in this workout (added from another tab or
      // device, or a double tap) — resync and jump to it.
      await reloadActive();
      closeOverlay();
      focusExerciseCard(err.body.id);
      return;
    }
    alert(err.status === 400 ? nameErrorMsg(err) : 'Could not add exercise — try again.');
    return;
  }
  active.exercises.push({ id, name, sets: [] });
  closeOverlay();
  renderWorkout();
}

async function reloadActive() {
  // Send typed-but-unsent set edits first, so the server copy includes them.
  setSaves.dropWhere(t => !setExists(t));
  await setSaves.flushAll();
  try {
    const fresh = await GET('/sessions/active');
    if (fresh && active && fresh.id === active.id) {
      // Anything still unsent (a save failed) stays visible instead of being
      // replaced by the older server value. So does an invalid value the user
      // typed (it is never stored, the server holds null): it stays on screen,
      // red, so FINISH still asks for it to be fixed.
      const local = new Map();
      for (const ex of active.exercises) for (const st of ex.sets) local.set(st.id, st);
      for (const ex of fresh.exercises || []) {
        for (const st of ex.sets || []) {
          const f = setSaves.pendingFields(st.id);
          if (f) for (const [k, v] of Object.entries(f)) st[k] = v ?? '';
          const old = local.get(st.id);
          if (old && !st.savedAt) {
            for (const k of ['reps', 'weight']) if (setFieldError(k, old[k])) st[k] = old[k];
          }
        }
      }
      active = fresh;
    }
  } catch (err) { console.error(err); }
  renderWorkout();
}

// Scroll an exercise card into view and flash it.
function focusExerciseCard(exId) {
  if (currentView !== 'workout') showView('workout');
  // Let the sheet close (and the iOS keyboard drop) before measuring.
  setTimeout(() => {
    const card = el('excard-' + exId);
    if (!card) return;
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.classList.remove('ex-flash');
    void card.offsetWidth;            // restart the animation on repeat taps
    card.classList.add('ex-flash');
  }, 120);
}

async function removeExercise(exId) {
  await DELETE(`/sessions/${active.id}/exercises/${exId}`);
  const gone = active.exercises.find(e => e.id === exId);
  (gone ? gone.sets : []).forEach(st => setSaves.drop(st.id));
  active.exercises = active.exercises.filter(e => e.id !== exId);
  renderWorkout();
}

async function addSet(exId) {
  const ex = active.exercises.find(e => e.id === exId);
  if (!ex) return;
  const id = uid();
  const position = ex.sets.length;
  await POST(`/sessions/${active.id}/exercises/${exId}/sets`, { id, position });
  ex.sets.push({ id, reps: '', weight: '', savedAt: null });
  renderWorkout();
}

// updateSetField: debounced PATCH — saves as you type (600ms, see js/saveQueue.js).
// The target ids are captured now, and setSaves.flushAll() pushes anything
// pending before the workout is reloaded or finished.
const setSaves = createSaveQueue(
  ({ sessionId, exId, setId }, fields) =>
    PATCH(`/sessions/${sessionId}/exercises/${exId}/sets/${setId}`, fields),
  600,
  {
    // 4xx: never retried. A 404 just means the set/exercise was removed; a
    // 400 means the server refused a value the checks below should have caught.
    onRejected(target, fields, err) {
      console.warn('Set update rejected:', err.status, fields);
      if (err.status === 400) alert(`A set value was not saved: ${(err.body && err.body.error) || 'invalid value'}.`);
    },
  }
);

// Value limits and messages: js/setFields.js (same limits as the server).
// Update one row's error state in place (no re-render, so the input keeps focus).
function showSetErrors(setId, s) {
  const row = el('setrow-' + setId);
  if (row) row.querySelectorAll('.set-input').forEach(inp =>
    inp.classList.toggle('invalid', !!setFieldError(inp.dataset.field, s[inp.dataset.field])));
  const msg = el('seterr-' + setId);
  if (msg) msg.textContent = setErrorText(s);
}
// First unsaved set in the active workout holding a value that can't be saved.
function firstInvalidSet() {
  for (const ex of active?.exercises || []) {
    for (const s of ex.sets) if (!s.savedAt && setErrorText(s)) return { exId: ex.id, setId: s.id };
  }
  return null;
}
// Does the save target still exist in the active workout?
function setExists(t) {
  return !!active && active.id === t.sessionId &&
    active.exercises.some(e => e.id === t.exId && e.sets.some(s => s.id === t.setId));
}

function updateSetField(exId, setId, field, val) {
  if (!active) return;
  const ex = active.exercises.find(e => e.id === exId);
  if (!ex) return;
  const s = ex.sets.find(s => s.id === setId);
  if (!s) return;
  s[field] = val;
  showSetErrors(setId, s);
  // Always replace this field's queued save. An invalid value is saved as null
  // (cleared): just skipping it would leave the previous keystroke ("2255" on
  // the way to "22555") queued or stored. Scheduling also bumps the field's
  // version, so an older in-flight save that fails is not retried.
  setSaves.schedule(setId, { sessionId: active.id, exId, setId }, { [field]: fieldSaveValue(field, val) });
}

async function saveSet(exId, setId) {
  const ex = active.exercises.find(e => e.id === exId);
  if (!ex) return;
  const s = ex.sets.find(s => s.id === setId);
  if (!s) return;
  if (setErrorText(s)) { showSetErrors(setId, s); return; }
  const target = { sessionId: active.id, exId, setId };
  const vals = { reps: Number(s.reps) || 0, weight: Number(s.weight) || 0, savedAt: new Date().toISOString() };
  // This PATCH carries every field, so the queued as-you-type save is no longer
  // needed — but one may already be in flight. Let it land first, so it can't
  // arrive after (and overwrite) this one.
  setSaves.drop(setId);
  await setSaves.flush(setId);
  try {
    await PATCH(`/sessions/${target.sessionId}/exercises/${exId}/sets/${setId}`, vals);
  } catch (err) {
    // Put the typed values back in the queue so FINISH still sends them.
    setSaves.schedule(setId, target, { reps: fieldSaveValue('reps', s.reps), weight: fieldSaveValue('weight', s.weight) });
    alert(err.status === 400 ? `Not saved: ${(err.body && err.body.error) || 'invalid value'}.`
      : 'Could not save the set — check your connection and try again.');
    return;
  }
  Object.assign(s, vals);
  renderWorkout(setId);
}

async function removeSet(exId, setId) {
  await DELETE(`/sessions/${active.id}/exercises/${exId}/sets/${setId}`);
  setSaves.drop(setId);
  const ex = active.exercises.find(e => e.id === exId);
  if (!ex) return;
  ex.sets = ex.sets.filter(s => s.id !== setId);
  renderWorkout();
}

// ─── Render: Home ─────────────────────────────────────────────────────────────
function renderHome() {
  const banner = el('in-progress-banner');
  const startBtn = el('start-btn');
  if (active) {
    banner.classList.add('visible');
    startBtn.style.display = 'none';
    el('banner-title').textContent = fmtDate(active.startedAt);
    el('banner-sub').textContent = `started ${fmtTime(active.startedAt)} · ${active.exercises.length} exercises · ${totalSavedSets(active)} sets saved`;
  } else {
    banner.classList.remove('visible');
    startBtn.style.display = '';
  }

  const recent = el('recent-list');
  const lbl = el('recent-label');
  if (sessions.length === 0) { recent.innerHTML = ''; lbl.style.display='none'; return; }
  lbl.style.display = '';
  recent.innerHTML = sessions.slice(0, 5).map(s => `
    <div class="card clickable" onclick="openDetail(${jsArg(s.id)})">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <div class="flex-fill">
          <div class="disp-sm">${fmtDate(s.startedAt)}</div>
          <div class="text-d">${s.exercises.length} exercises · ${s.exercises.reduce((a,e)=>a+e.sets.length,0)} sets</div>
          <div style="margin-top:8px; line-height:2;">${(s.exercises||[]).map(e=>`<span class="pill">${esc(e.name)}</span>`).join('')}</div>
        </div>
        <span class="no-shrink" style="color:var(--text-f); font-size:18px;">›</span>
      </div>
    </div>
  `).join('');
}

// ─── Render: Workout ──────────────────────────────────────────────────────────
function renderWorkout(flashSetId) {
  if (!active) return;
  el('workout-title').textContent = fmtDate(active.startedAt);
  el('workout-time').textContent = fmtTime(active.startedAt);
  el('workout-sub').textContent = `${totalSavedSets(active)} sets saved`;

  const list = el('exercises-list');
  if (active.exercises.length === 0) {
    list.innerHTML = `<div style="text-align:center; padding:36px 0; color:var(--text-d); font-size:12px;">no exercises yet — add one below</div>`;
    return;
  }

  list.innerHTML = active.exercises.map(ex => {
    const stats = exerciseStats(ex.name);
    const statsHtml = stats ? `
      <div class="stat-row">
        <div class="stat-tag"><span class="stat-label">PR</span><span class="stat-val text-accent">${stats.maxWeight}lb</span></div>
        <div class="stat-tag"><span class="stat-label">avg</span><span class="stat-val">${stats.avgWeight}lb</span></div>
      </div>` : '';

    const setsHeaderHtml = ex.sets.length ? `
      <div class="set-headers">
        <div class="set-header-cell">#</div>
        <div class="set-header-cell">REPS</div>
        <div class="set-header-cell">LB</div>
        <div class="set-header-cell">SAVE</div>
        <div></div>
      </div>` : '';

    const setsHtml = ex.sets.map((s, si) => {
      const saved = !!s.savedAt;
      const flash = s.id === flashSetId ? 'set-flash' : '';
      return `
        <div class="set-row ${flash}" id="setrow-${esc(s.id)}">
          <div class="set-num ${saved ? 'saved' : ''}">${si+1}</div>
          <input class="set-input ${saved ? 'saved' : ''} ${!saved && setFieldError('reps', s.reps) ? 'invalid' : ''}" data-field="reps" type="number" inputmode="numeric" placeholder="—"
            value="${esc(s.reps)}" ${saved ? 'readonly' : ''}
            onchange="updateSetField(${jsArg(ex.id)},${jsArg(s.id)},'reps',this.value)"
            oninput="updateSetField(${jsArg(ex.id)},${jsArg(s.id)},'reps',this.value)">
          <input class="set-input ${saved ? 'saved' : ''} ${!saved && setFieldError('weight', s.weight) ? 'invalid' : ''}" data-field="weight" type="number" inputmode="decimal" placeholder="—"
            value="${esc(s.weight)}" ${saved ? 'readonly' : ''}
            onchange="updateSetField(${jsArg(ex.id)},${jsArg(s.id)},'weight',this.value)"
            oninput="updateSetField(${jsArg(ex.id)},${jsArg(s.id)},'weight',this.value)">
          ${saved
            ? `<div class="set-saved-check">✓</div>`
            : `<button class="set-save-btn" onclick="saveSet(${jsArg(ex.id)},${jsArg(s.id)})">save</button>`
          }
          <button class="set-del-btn" onclick="removeSet(${jsArg(ex.id)},${jsArg(s.id)})">×</button>
        </div>
        <div class="set-err" id="seterr-${esc(s.id)}">${saved ? '' : esc(setErrorText(s))}</div>`;
    }).join('');

    return `
      <div class="ex-card" id="excard-${esc(ex.id)}">
        <div class="ex-header">
          <div class="flex-fill">
            <div class="disp-md">${esc(ex.name)}</div>
            ${statsHtml}
          </div>
          <button class="ex-del" onclick="removeExercise(${jsArg(ex.id)})">×</button>
        </div>
        ${setsHeaderHtml}
        ${setsHtml}

// ─── Editing a finished workout (mine, within the edit window) ───────────────
// The server enforces the window (403 after it) and ownership (404); this is
// only so the UI doesn't offer what the server will refuse.
const EDIT_WINDOW_DAYS = 7;   // same as backend/src/db/editWindow.js (fallback only)
function editableUntilOf(sess) {
  if (sess.editableUntil) return new Date(sess.editableUntil);
  return sess.finishedAt ? new Date(new Date(sess.finishedAt).getTime() + EDIT_WINDOW_DAYS * 864e5) : null;
}
function canEditSession(sess) {
  const until = sess && sess.finishedAt ? editableUntilOf(sess) : null;
  return !!until && Date.now() < until.getTime();
}
function editedTag(iso) {
  return `<span class="edited-tag"${iso ? ` title="edited ${esc(fmtDate(iso))}"` : ""}>edited</span>`;
}

// Debounced set saves for the workout being edited (same rules as the live
// workout: an invalid value is saved as null and stays red until fixed).
const editSaves = createSaveQueue(
  ({ sessionId, exId, setId }, fields) =>
    PATCH(`/sessions/${sessionId}/exercises/${exId}/sets/${setId}`, fields),
  600,
  { onRejected(target, fields, err) { editRejected(err); } }
);

function editRejected(err) {
  if (err && err.status === 403) {
    alert((err.body && err.body.error) || 'Editing closed for this workout.');
    detailEditing = false;
    refreshDetailSession();
  } else if (err && err.status === 400) {
    alert(`Not saved: ${(err.body && err.body.error) || 'invalid value'}.`);
  } else if (err && err.status === 404) {
    refreshDetailSession();   // something was removed elsewhere
  } else {
    alert('Could not save the change — check your connection and try again.');
  }
}
// Run one edit call; returns true on success.
async function editCall(fn) {
  try { await fn(); markDetailEdited(); return true; }
  catch (err) { editRejected(err); return false; }
}
function markDetailEdited() {
  if (detailSession && !detailSession.editedAt) {
    detailSession.editedAt = new Date().toISOString();
    el('detail-edited').innerHTML = editedTag(detailSession.editedAt);
  }
}
// Replace my local copy of the open session with the server's.
async function refreshDetailSession() {
  if (!detailSession || detailOwner) return;
  const id = detailSession.id;
  try {
    const fresh = await GET(`/sessions/${id}`);
    sessions = sessions.map(x => x.id === id ? fresh : x);
    if (detailSession && detailSession.id === id) detailSession = fresh;
  } catch (err) {
    if (err.status === 404) { sessions = sessions.filter(x => x.id !== id); showView('history'); return; }
  }
  if (currentView === 'session-detail') renderDetail();
}

function startEditing() {
  if (!detailSession || detailOwner || !canEditSession(detailSession)) return;
  detailEditing = true;
  renderDetail();
}
async function doneEditing() {
  const bad = (detailSession.exercises || []).flatMap(ex => ex.sets).find(st => setErrorText(st));
  if (bad) { showSetErrors(bad.id, bad); alert(`Fix the highlighted set value first.\n${SET_LIMITS_MSG}`); return; }
  if (!(await editSaves.flushAll()) && !confirm('Some changes could not be saved. Stop editing anyway?')) return;
  detailEditing = false;
  await refreshDetailSession();
}

function renderDetailEdit() {
  const sess = detailSession;
  el('detail-exercises').innerHTML = (sess.exercises || []).map(ex => `
    <div class="ex-card" id="edcard-${esc(ex.id)}">
      <div class="ex-header">
        <div class="flex-fill"><div class="disp-md">${esc(ex.name)}</div></div>
        <button class="ex-del" aria-label="remove exercise" onclick="editRemoveExercise(${jsArg(ex.id)})">×</button>
      </div>
      ${ex.sets.length ? `
      <div class="edit-set-row">
        <div class="set-header-cell">#</div><div class="set-header-cell">REPS</div><div class="set-header-cell">LB</div><div></div>
      </div>` : ''}
      ${ex.sets.map((st, si) => `
        <div class="edit-set-row" id="setrow-${esc(st.id)}">
          <div class="set-num saved">${si + 1}</div>
          <input class="set-input ${setFieldError('reps', st.reps) ? 'invalid' : ''}" data-field="reps" type="number" inputmode="numeric" placeholder="—"
            value="${esc(st.reps ?? '')}" oninput="editSetField(${jsArg(ex.id)},${jsArg(st.id)},'reps',this.value)">
          <input class="set-input ${setFieldError('weight', st.weight) ? 'invalid' : ''}" data-field="weight" type="number" inputmode="decimal" placeholder="—"
            value="${esc(st.weight ?? '')}" oninput="editSetField(${jsArg(ex.id)},${jsArg(st.id)},'weight',this.value)">
          <button class="set-del-btn" aria-label="delete set" onclick="editRemoveSet(${jsArg(ex.id)},${jsArg(st.id)})">×</button>
        </div>
        <div class="set-err" id="seterr-${esc(st.id)}">${esc(setErrorText(st))}</div>`).join('')}
      <button class="btn-ghost" onclick="editAddSet(${jsArg(ex.id)})">+ add set</button>
    </div>`).join('') || `<div class="empty">no exercises left in this workout</div>`;
}

function findEditSet(exId, setId) {
  const ex = (detailSession?.exercises || []).find(e => e.id === exId);
  return { ex, st: ex && ex.sets.find(x => x.id === setId) };
}
function editSetField(exId, setId, field, val) {
  if (!detailEditing) return;
  const { st } = findEditSet(exId, setId);
  if (!st) return;
  st[field] = val;
  showSetErrors(setId, st);
  editSaves.schedule(setId, { sessionId: detailSession.id, exId, setId }, { [field]: fieldSaveValue(field, val) });
  markDetailEdited();
}
async function editAddSet(exId) {
  const sess = detailSession;
  const ex = (sess.exercises || []).find(e => e.id === exId);
  if (!ex) return;
  const id = uid();
  if (await editCall(() => POST(`/sessions/${sess.id}/exercises/${exId}/sets`, { id }))) {
    ex.sets.push({ id, reps: '', weight: '', savedAt: null });
    if (detailEditing) renderDetailEdit();
  }
}
async function editRemoveSet(exId, setId) {
  const sess = detailSession;
  editSaves.drop(setId);
  await editSaves.flush(setId);
  if (await editCall(() => DELETE(`/sessions/${sess.id}/exercises/${exId}/sets/${setId}`))) {
    const { ex } = findEditSet(exId, setId);
    if (ex) ex.sets = ex.sets.filter(x => x.id !== setId);
    if (detailEditing) renderDetail();
  }
}
async function editRemoveExercise(exId) {
  const sess = detailSession;
  const ex = (sess.exercises || []).find(e => e.id === exId);
  if (!ex || !confirm(`Remove ${ex.name} and its ${ex.sets.length} set(s) from this workout?`)) return;
  ex.sets.forEach(st => editSaves.drop(st.id));
  if (await editCall(() => DELETE(`/sessions/${sess.id}/exercises/${exId}`))) {
    sess.exercises = sess.exercises.filter(e => e.id !== exId);
    if (detailEditing) renderDetail();
  }
}
async function deleteWorkout() {
  const sess = detailSession;
  if (!sess || detailOwner) return;
  if (!confirm(`Delete this workout from ${fmtDate(sess.startedAt)}? This can't be undone.`)) return;
  editSaves.dropWhere(t => t.sessionId === sess.id);
  try {
    await DELETE(`/sessions/${sess.id}`);
  } catch (err) {
    if (err.status !== 404) { editRejected(err); return; }
  }
  sessions = sessions.filter(x => x.id !== sess.id);
  detailEditing = false;
  detailSession = null;
  showView('history');
}

function setFriendsBadge() {

async function loadFriends() {

function renderFriends() {
  const { friends, incoming, outgoing } = friendsData;
  el('friends-incoming').innerHTML = incoming.length ? `
    <div class="section-label">requests</div>
    ${incoming.map((r, i) => `
      <div class="friend-row">
        <div class="friend-name">${esc(r.username)}<span class="sub">wants to be friends</span></div>
        <button class="mini-btn accent" onclick="acceptRequest(${i})">accept</button>
        <button class="mini-btn danger" onclick="declineRequest(${i})">decline</button>
      </div>`).join('')}` : '';

  el('friends-list').innerHTML = `
    <div class="section-label">friends</div>
    ${friends.length ? friends.map((f, i) => `

  el('friends-outgoing').innerHTML = outgoing.length ? `
    <div class="section-label">sent requests</div>
    ${outgoing.map((r, i) => `
      <div class="friend-row">
        <div class="friend-name">${esc(r.username)}<span class="sub">pending</span></div>
        <button class="mini-btn" onclick="cancelRequest(${i})">cancel</button>
      </div>`).join('')}` : '';
}

function friendMsg(text, isErr) {
  el('friend-msg').textContent = text || '';
  el('friend-msg').classList.toggle('err', !!isErr);
}

let searchTimer = null, searchSeq = 0;
function onFriendSearch() {
  friendMsg('');
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runFriendSearch, 250);
}
async function runFriendSearch() {
  const q = el('friend-search').value.trim();
  const seq = ++searchSeq;
  if (!q) { searchResults = []; renderSearch(); return; }
  try {
    const res = await GET('/friends/search?q=' + encodeURIComponent(q));
    if (seq !== searchSeq) return;   // a newer search superseded this one
    searchResults = res;
    renderSearch();
  } catch (err) {
    if (seq === searchSeq) friendMsg('search failed', true);
  }
}
function renderSearch() {
  const q = el('friend-search').value.trim();
  const box = el('friend-search-results');
  if (!q) { box.innerHTML = ''; return; }
  if (!searchResults.length) {
    box.innerHTML = `<div class="empty" style="padding:12px 0;">no user found${q.length < 2 ? ' — type at least 2 letters' : ''}</div>`;
    return;
  }
  box.innerHTML = searchResults.map((r, i) => {
    const action = r.status === 'none' ? `<button class="mini-btn accent" onclick="sendRequest(${i})">add</button>`
      : r.status === 'incoming' ? `<button class="mini-btn accent" onclick="sendRequest(${i})">accept</button>`
      : r.status === 'outgoing' ? `<span class="mini-tag">requested</span>`
      : `<span class="mini-tag">friends ✓</span>`;
    return `<div class="friend-row"><div class="friend-name">${esc(r.username)}</div>${action}</div>`;
  }).join('');
}

async function friendAction(fn, okMsg) {
  try {
    await fn();
    if (okMsg) friendMsg(okMsg);
  } catch (err) {
    friendMsg(err.status === 404 ? 'that request no longer exists'
      : err.status === 409 ? 'already requested or friends'
      : 'something went wrong — try again', true);
  }
  await loadFriends();
}
function sendRequest(i) {
  const r = searchResults[i];
  if (!r) return;
  friendAction(async () => {
    const res = await POST('/friends/requests', { username: r.username });
    r.status = res.status;
  }, r.status === 'incoming' ? `you and ${r.username} are now friends` : `request sent to ${r.username}`);
}
function acceptRequest(i) {
  const r = friendsData.incoming[i];
  if (r) friendAction(() => POST(`/friends/requests/${encodeURIComponent(r.username)}/accept`), `you and ${r.username} are now friends`);
}
function declineRequest(i) {
  const r = friendsData.incoming[i];
  if (r) friendAction(() => DELETE(`/friends/requests/${encodeURIComponent(r.username)}`));
}
function cancelRequest(i) {
  const r = friendsData.outgoing[i];
  if (r) friendAction(() => DELETE(`/friends/requests/${encodeURIComponent(r.username)}`));
}
function removeFriend(i) {
  const f = friendsData.friends[i];
  if (!f || !confirm(`Remove ${f.username} from your friends? You'll stop seeing each other's workouts.`)) return;
  friendAction(() => DELETE(`/friends/${encodeURIComponent(f.username)}`));
}

// ─── Leaderboard ──────────────────────────────────────────────────────────────
// Boards come from /api/leaderboard/*: the server decides who is on them (you +
// accepted friends) and which workouts count (finished only). Everything
// user-controlled (usernames, exercise names) goes through esc().
let lbBoard = 'week';           // 'week' | 'month' | 'strength'
const lbData = {};              // board -> last response
const lbOpen = {};              // board -> open row key (username / exercise key)
const lbDetail = {};            // lowercased exercise name -> strength detail response
let lbSeq = 0;

const LB_STATUS = {
  new: 'first time: sets your baseline',
  'no-gain': 'no gain on baseline',
  ignored: 'jump too big, ignored',
  capped: 'capped',
  scored: '',
};

function fmtDay(ymd) {   // 'YYYY-MM-DD' (a local date in the board's timezone)
  return new Date(ymd + 'T12:00:00Z').toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', timeZone:'UTC' });
}
function fmtShortDate(iso) {
  const d = new Date(iso);
  const sameYear = d.getFullYear() === new Date().getFullYear();
  return d.toLocaleDateString('en-US', sameYear ? { month:'short', day:'numeric' } : { month:'short', day:'numeric', year:'numeric' });
}
function resetsIn(endIso) {
  const ms = new Date(endIso) - Date.now();
  if (ms <= 0) return 'resetting now';
  const mins = Math.floor(ms / 60000), h = Math.floor(mins / 60), d = Math.floor(h / 24);
  if (d >= 1) return `resets in ${d}d ${h % 24}h`;
  if (h >= 1) return `resets in ${h}h ${mins % 60}m`;
  return `resets in ${Math.max(1, mins)}m`;
}
const fmtNum = (n) => (n === null || n === undefined) ? '—' : String(Math.round(n * 10) / 10);

function setLbBoard(board) {
  if (!['week', 'month', 'strength'].includes(board)) return;
  lbBoard = board;
  document.querySelectorAll('#lb-seg .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.board === board));
  loadLeaderboard();
}

async function loadLeaderboard() {
  const board = lbBoard;
  const seq = ++lbSeq;
  if (lbData[board]) renderLeaderboard();
  else { el('lb-cta').innerHTML = ''; el('lb-head').innerHTML = ''; el('lb-filter').style.display = 'none'; el('lb-list').innerHTML = `<div class="loading">loading…</div>`; }
  try {
    const path = board === 'week' ? '/leaderboard/weekly' : board === 'month' ? '/leaderboard/monthly' : '/leaderboard/strength';
    const res = await GET(path);
    if (seq !== lbSeq) return;   // switched boards meanwhile
    lbData[board] = res;
    if (board === 'strength') for (const k of Object.keys(lbDetail)) delete lbDetail[k];
    renderLeaderboard();
    // Re-fetch an already open strength exercise so it isn't stale.
    if (board === 'strength' && lbOpen.strength) loadStrengthDetail(lbOpen.strength);
  } catch (err) {
    if (seq !== lbSeq) return;
    if (!lbData[board]) el('lb-list').innerHTML = `<div class="empty">could not load leaderboard</div>`;
  }
}

function renderLeaderboard() {
  if (currentView !== 'leaderboard') return;
  const data = lbData[lbBoard];
  if (!data) return;
  el('lb-cta').innerHTML = data.hasFriends ? '' : `
    <div class="card lb-cta">
      <div class="disp-md">ADD FRIENDS TO COMPETE</div>
      <div class="text-d">only you and your accepted friends appear here</div>
      <button class="btn-secondary" onclick="showView('friends')">FIND FRIENDS</button>
    </div>`;
  if (lbBoard === 'strength') renderStrength(data);
  else renderPoints(data);
}

function renderPoints(data) {
  el('lb-filter').style.display = 'none';
  const word = data.period === 'week' ? 'week' : 'month';
  const r = data.rules;
  el('lb-head').innerHTML = `
    <div class="lb-period">${esc(fmtDay(data.startDate))} – ${esc(fmtDay(data.endDate))} · <span class="text-accent">${esc(resetsIn(data.end))}</span></div>
    <div class="lb-rules">+1% on your best estimated 1RM vs your last ${r.baselineWeeks} weeks = ${r.pointsPerPercent} pts (max ${r.progressCap} per exercise, ${r.progressTotalCap} total this ${word}; jumps over ${r.maxGainPct}% don't count) · ${r.pointsPerDay} pts per workout day (max ${r.daysCap}) · tap a row for details</div>`;
  const noPoints = data.entries.every(e => e.total === 0);
  el('lb-list').innerHTML = (noPoints
      ? `<div class="empty" style="padding:4px 0 14px;">no points yet this ${word} — finish a workout to get on the board</div>` : '')
    + data.entries.map(e => {
      const open = lbOpen[lbBoard] === e.username;
      return `
      <button class="lb-row${e.isYou ? ' you' : ''}${open ? ' open' : ''}" data-key="${esc(e.username)}">
        <span class="lb-rank${e.rank === 1 && e.total > 0 ? ' first' : ''}">${e.rank}</span>
        <span class="lb-name">@${esc(e.username)}${e.isYou ? '<span class="sub lb-you">you</span>' : ''}</span>
        <span class="lb-pts">${e.total}<small>pts</small></span>
        <span class="lb-chev">${open ? '▾' : '›'}</span>
      </button>
      ${open ? pointsBreakdown(e, data) : ''}`;
    }).join('');
}

function pointsBreakdown(e, data) {
  const c = e.consistency;
  const dayWord = (n) => n === 1 ? 'day' : 'days';
  const consistency = `
    <div class="lb-line">
      <span class="main">consistency<span class="sub">${c.days} workout ${dayWord(c.days)}${c.days > c.countedDays ? ` (max ${c.countedDays} count)` : ''} × ${data.rules.pointsPerDay}</span></span>
      <span class="val${c.points ? '' : ' zero'}">${c.points}</span>
    </div>`;
  const lifts = e.exercises.length ? e.exercises.map(x => {
    const gain = x.pct === null ? '' : ` · ${x.pct > 0 ? '+' : ''}${fmtNum(x.pct)}%`;
    const line = x.baseline === null
      ? `best e1RM ${fmtNum(x.best)} lb`
      : `e1RM ${fmtNum(x.baseline)} → ${fmtNum(x.best)} lb${gain}`;
    const note = LB_STATUS[x.status] ? ` · ${LB_STATUS[x.status]}` : '';
    return `
    <div class="lb-line">
      <span class="main">${esc(x.name)}<span class="sub">${esc(line + note)}</span></span>
      <span class="val${x.points ? '' : ' zero'}">${x.points}</span>
    </div>`;
  }).join('') : `<div class="lb-line"><span class="main text-d">no lifts in the 1–${data.rules.maxReps} rep range this ${data.period}</span></div>`;
  const cap = e.progressCapped ? `
    <div class="lb-line">
      <span class="main">progress total<span class="sub">${e.progressRaw} pts → capped at ${data.rules.progressTotalCap} per ${data.period}</span></span>
      <span class="val">${e.progress}</span>
    </div>` : '';
  return `<div class="lb-detail">${consistency}${cap}${lifts}</div>`;
}

function renderStrength(data) {
  el('lb-head').innerHTML = `<div class="lb-rules">all-time heaviest weight lifted for at least 1 rep · ties: more reps, then first to do it · a lift more than ${data.crownMaxJumpPct ?? 50}% above your next-best is "unverified" until you back it up · tap an exercise for everyone's best</div>`;
  const filter = el('lb-filter');
  filter.style.display = data.exercises.length ? '' : 'none';
  if (!data.exercises.length) {
    el('lb-list').innerHTML = `<div class="empty">no finished workouts yet — lift something!</div>`;
    return;
  }
  const q = filter.value.trim().toLowerCase();
  const list = q ? data.exercises.filter(x => x.name.toLowerCase().includes(q)) : data.exercises;
  if (!list.length) { el('lb-list').innerHTML = `<div class="empty">no exercise matches “${esc(filter.value.trim())}”</div>`; return; }
  el('lb-list').innerHTML = list.map(x => {
    const key = x.name.toLowerCase();
    const open = lbOpen.strength === key;
    const h = x.holder;   // null while every top lift is unverified
    return `
      <button class="lb-row${open ? ' open' : ''}" data-key="${esc(key)}">
        <span class="lb-name" style="white-space:normal;">
          <span class="lb-ex-name">${esc(x.name)}</span>
          <span class="sub">${h
            ? `👑 @${esc(h.username)}${h.isYou ? ' (you)' : ''} · ${fmtNum(h.weight)} lb × ${h.reps} · ${esc(fmtShortDate(h.date))}${h.edited ? editedTag() : ''}`
            : `no verified lift yet`}</span>
        </span>
        <span class="lb-chev">${open ? '▾' : '›'}</span>
      </button>
      ${open ? strengthDetail(key) : ''}`;
  }).join('');
}

function strengthDetail(key) {
  const d = lbDetail[key];
  if (!d) return `<div class="lb-detail"><div class="loading" style="padding:12px 0;">loading…</div></div>`;
  if (d.error) return `<div class="lb-detail"><div class="empty" style="padding:12px 0;">${esc(d.error)}</div></div>`;
  return `<div class="lb-detail">${d.entries.map(e => `
    <div class="lb-line${e.isYou ? ' you' : ''}">
      <span class="lb-rank${e.rank === 1 ? ' first' : ''}" style="font-size:17px;">${e.rank === 1 ? '👑' : e.rank}</span>
      <span class="main">@${esc(e.username)}${e.isYou ? ' (you)' : ''}<span class="sub">${esc(fmtShortDate(e.date))}${e.e1rm !== null ? ` · e1RM ~${fmtNum(e.e1rm)} lb` : ''}${e.edited ? editedTag() : ''}</span></span>
      <span class="val">${fmtNum(e.weight)}<small style="font-family:var(--mono); font-size:10px; color:var(--text-d);"> × ${e.reps}</small></span>
    </div>`).join('')}${(d.unverified || []).map(e => `
    <div class="lb-line unverified">
      <span class="lb-rank" style="font-size:17px;">–</span>
      <span class="main">@${esc(e.username)}${e.isYou ? ' (you)' : ''}<span class="lb-unv">unverified</span><span class="sub">${esc(fmtShortDate(e.date))} · counts once backed up by another lift within ${d.crownMaxJumpPct ?? 50}% of it${e.edited ? editedTag() : ''}</span></span>
      <span class="val">${fmtNum(e.weight)}<small style="font-family:var(--mono); font-size:10px; color:var(--text-d);"> × ${e.reps}</small></span>
    </div>`).join('')}</div>`;
}

async function loadStrengthDetail(key) {
  try {
    lbDetail[key] = await GET('/leaderboard/strength/' + encodeURIComponent(key));
  } catch (err) {
    lbDetail[key] = { error: err.status === 404 ? 'nobody on your board has done this yet' : 'could not load' };
  }
  if (lbBoard === 'strength' && lbOpen.strength === key) renderLeaderboard();
}

function toggleLbRow(key) {
  lbOpen[lbBoard] = lbOpen[lbBoard] === key ? null : key;
  renderLeaderboard();
  if (lbBoard === 'strength' && lbOpen.strength === key && !lbDetail[key]) loadStrengthDetail(key);
}

// Rows carry the username / exercise key in a data-* attribute (escaped), not
// in an inline handler.
el('lb-seg').addEventListener('click', e => {
  const b = e.target.closest('.seg-btn');
  if (b) setLbBoard(b.dataset.board);
});
el('lb-list').addEventListener('click', e => {
  const row = e.target.closest('.lb-row');
  if (row && el('lb-list').contains(row)) toggleLbRow(row.dataset.key);
});

// ─── Manage exercises (shared library) ───────────────────────────────────────
// The library is shared by every user. Renaming changes the library only; logged
// workouts keep the name they were recorded with (the server never rewrites them).
function openManage() {
  if (currentView === 'manage') return;
  manageReturn = currentView;
  manageEditing = null;
  manageMsg('');
  showView('manage');
}
function manageMsg(text, isErr) {
  el('manage-msg').textContent = text || '';
  el('manage-msg').classList.toggle('err', !!isErr);
}
function sortExercises() { exercises.sort((a, b) => a.localeCompare(b)); }
// One library write at a time, so a double-tap can't send the same request twice.
let manageBusy = false;
async function manageWrite(fn) {
  if (manageBusy) return;
  manageBusy = true;
  try { await fn(); } finally { manageBusy = false; }
}

// Other people may have changed the list, so refresh it whenever the page opens.
async function loadManage() {
  renderManage();
  try { exercises = await GET('/exercises'); } catch (err) { console.error(err); return; }
  if (manageEditing !== null && !exercises.includes(manageEditing)) manageEditing = null;
  if (currentView === 'manage') renderManage();
}

function renderManage() {
  const filter = (el('manage-filter').value || '').toLowerCase();
  const filtered = exercises.filter(e => e.toLowerCase().includes(filter) || e === manageEditing);
  const list = el('manage-list');
  if (!filtered.length) {
    list.innerHTML = `<div class="empty">${exercises.length ? 'no exercises match' : 'no exercises yet'}</div>`;
    return;
  }
  list.innerHTML = filtered.map(name => name === manageEditing ? `
    <div class="ex-manage-row">
      <input class="ex-edit-input" type="text" maxlength="60" value="${esc(manageDraft)}"
        aria-label="new name" autocomplete="off" enterkeyhint="done">
      <button class="mini-btn accent ex-save-btn" data-name="${esc(name)}">save</button>
      <button class="mini-btn ex-cancel-btn" data-name="${esc(name)}">cancel</button>
    </div>` : `
    <div class="ex-manage-row">
      <span class="ex-manage-name">${esc(name)}</span>
      <button class="mini-btn ex-edit-btn" data-name="${esc(name)}">edit</button>
      <button class="mini-btn danger ex-remove-btn" data-name="${esc(name)}">remove</button>
    </div>`).join('');
}

function addLibraryExercise() { return manageWrite(doAddLibraryExercise); }
// "new exercise..." box: Enter adds; Escape clears the box and any stale message.
function manageNewKey(e) {
  if (e.key === 'Enter') addLibraryExercise();
  if (e.key === 'Escape') { e.target.value = ''; manageMsg(''); }
}
async function doAddLibraryExercise() {
  const input = el('manage-new');
  const name = input.value.trim();
  if (!name) { manageMsg(''); return; }
  const dup = exercises.find(e => sameName(e, name));
  if (dup) { manageMsg(`"${dup}" is already in the list`, true); return; }
  try {
    await POST('/exercises', { name });
  } catch (err) {
    if (err.status === 409) {
      // Someone else added it (in some casing) since this list was loaded.
      const existing = (err.body && err.body.name) || name;
      if (!exercises.includes(existing)) exercises.push(existing);
      sortExercises();
      manageMsg(`"${existing}" is already in the list`, true);
      renderManage();
      return;
    }
    manageMsg(err.status === 400 ? nameErrorMsg(err) : 'Could not add exercise — try again.', true);
    return;
  }
  if (!exercises.includes(name)) exercises.push(name);
  sortExercises();
  input.value = '';
  manageMsg(`added "${name}"`);
  renderManage();
}

function startRename(name) {
  manageEditing = name;
  manageDraft = name;
  manageMsg('');
  renderManage();
  const input = el('manage-list').querySelector('.ex-edit-input');
  if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
}
function cancelRename() {
  manageEditing = null;
  manageMsg('');
  renderManage();
}
function saveRename(oldName) { return manageWrite(() => doSaveRename(oldName)); }
async function doSaveRename(oldName) {
  const name = manageDraft.trim();
  if (!name) { manageMsg(EXERCISE_NAME_MSG, true); return; }
  if (name === oldName) { cancelRename(); return; }
  try {
    const res = await PATCH(`/exercises/${encodeURIComponent(oldName)}`, { name });
    exercises = exercises.map(e => e === oldName ? res.name : e);
    sortExercises();
    manageEditing = null;
    manageMsg(`renamed to "${res.name}"`);
  } catch (err) {
    if (err.status === 409) { manageMsg('another exercise already has that name', true); return; }
    if (err.status === 400) { manageMsg(nameErrorMsg(err), true); return; }
    if (err.status === 404) {
      manageMsg('that exercise was removed or renamed by someone else — list refreshed', true);
      manageEditing = null;
      loadManage();
      return;
    }
    manageMsg('Could not rename exercise — try again.', true);
    return;
  }
  renderManage();
}

function removeExercise_lib(name) { return manageWrite(() => doRemoveExercise(name)); }
async function doRemoveExercise(name) {
  if (!confirm(`Remove "${name}" from the exercise list?\n\nThe list is shared, so it disappears for everyone. Past workouts keep it.`)) return;
  try {
    await DELETE(`/exercises/${encodeURIComponent(name)}`);
  } catch (err) {
    manageMsg('Could not remove exercise — try again.', true);
    return;
  }
  exercises = exercises.filter(e => e !== name);
  manageMsg(`removed "${name}"`);
  renderManage();
}

// ─── Overlay ──────────────────────────────────────────────────────────────────
// Keep the overlay sized to the *visible* viewport so the iOS keyboard
// doesn't cover the bottom sheet (position:fixed tracks the layout viewport).
function fitOverlayToViewport() {
  const vv = window.visualViewport, o = el('overlay');
  if (!vv) return;
  o.style.top = vv.offsetTop + 'px';
  o.style.height = vv.height + 'px';
}
function openOverlay() {
  el('ex-filter').value = '';
  renderOverlay();
  el('overlay').classList.add('open');
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', fitOverlayToViewport);
    visualViewport.addEventListener('scroll', fitOverlayToViewport);
    fitOverlayToViewport();
  }
  setTimeout(() => el('ex-filter').focus(), 100);
  refreshOverlayLibrary();
}
// The library is shared: show the cached list at once, then pick up other
// people's adds/renames in the background. Only re-render if it changed, so
// the list doesn't flicker under a finger.
async function refreshOverlayLibrary() {
  let fresh;
  try { fresh = await GET('/exercises'); } catch (err) { console.error(err); return; }
  if (!Array.isArray(fresh)) return;
  const changed = JSON.stringify(fresh) !== JSON.stringify(exercises);
  exercises = fresh;
  if (changed && el('overlay').classList.contains('open')) renderOverlay();
}
function closeOverlay() {
  el('ex-filter').blur();   // drop the iOS keyboard
  el('overlay').classList.remove('open');
  if (window.visualViewport) {
    visualViewport.removeEventListener('resize', fitOverlayToViewport);
    visualViewport.removeEventListener('scroll', fitOverlayToViewport);
  }
  el('overlay').style.top = '';
  el('overlay').style.height = '';
}
function overlayBgClick(e) { if (e.target === el('overlay')) closeOverlay(); }

function renderOverlay() {
  const filter = el('ex-filter').value.trim();
  const filtered = exercises.filter(e => e.toLowerCase().includes(filter.toLowerCase()));

  const createBtn = el('create-btn-container');
  if (filter && !exercises.some(e => e.toLowerCase() === filter.toLowerCase())) {
    createBtn.innerHTML = `<button class="ex-create-btn" data-name="${esc(filter)}">＋ create "${esc(filter)}"</button>`;
  } else {
    createBtn.innerHTML = '';
  }

  el('ex-list').innerHTML = filtered.map(name => `
    <button class="ex-pick-btn" data-name="${esc(name)}">
      ${esc(name)}${workoutExercise(name) ? ' <span style="color:var(--accent-t); font-size:10px;">✓ added</span>' : ''}
    </button>
  `).join('');
}

// Library names are unique ignoring case. If the name already exists in any
// casing — locally, or on the server when this list is stale (409) — add the
// existing library exercise, with the library's spelling, instead of erroring.
async function createAndAdd(name) {
  name = String(name || '').trim();
  if (!name) return;
  if (workoutExercise(name)) { addExerciseToSession(name); return; }   // jumps to it
  const local = exercises.find(e => sameName(e, name));
  if (local) { addExerciseToSession(local); return; }
  try {
    await POST('/exercises', { name });
  } catch (err) {
    if (err.status === 409) {
      name = (err.body && err.body.name) || name;
    } else {
      alert(err.status === 400 ? nameErrorMsg(err) : 'Could not create exercise — try again.');
      return;
    }
  }
  if (!exercises.includes(name)) { exercises.push(name); sortExercises(); }
  addExerciseToSession(name);
}

// Exercise names are free text shared by every user, so the buttons that act on
// them carry the name in a data-* attribute (HTML-escaped) and are wired up here
// instead of interpolating the name into an inline onclick.
function onNameButton(containerId, selector, fn) {
  el(containerId).addEventListener('click', e => {
    const btn = e.target.closest(selector);
    if (btn && el(containerId).contains(btn)) fn(btn.dataset.name);
  });
}
onNameButton('ex-list', '.ex-pick-btn', addExerciseToSession);
onNameButton('create-btn-container', '.ex-create-btn', createAndAdd);
onNameButton('manage-list', '.ex-remove-btn', removeExercise_lib);
onNameButton('manage-list', '.ex-edit-btn', startRename);
onNameButton('manage-list', '.ex-save-btn', saveRename);
onNameButton('manage-list', '.ex-cancel-btn', cancelRename);
el('manage-list').addEventListener('input', e => {
  if (e.target.classList.contains('ex-edit-input')) manageDraft = e.target.value;
});
el('manage-list').addEventListener('keydown', e => {
  if (!e.target.classList.contains('ex-edit-input') || manageEditing === null) return;
  if (e.key === 'Enter') { e.preventDefault(); saveRename(manageEditing); }
  if (e.key === 'Escape') cancelRename();
});

// ─── Expose inline-handler functions (module scope is not global) ─────────────
Object.assign(window, {
  showView, goBack, startSession, finishSession,
  removeExercise,
  addSet, saveSet, removeSet, updateSetField,
  openOverlay, renderOverlay, overlayBgClick, openDetail, renderManage,
  openManage, addLibraryExercise, manageNewKey,
  logout,
  onFriendSearch, sendRequest, acceptRequest, declineRequest, cancelRequest, removeFriend,
  openFriendHistory, loadMoreFriendHistory, openFhItem, loadMoreFeed, openFeedItem,
  renderLeaderboard,
  startEditing, doneEditing, editSetField, editAddSet, editRemoveSet, editRemoveExercise, deleteWorkout,
});

// ─── Boot: require a valid token before loading the app ───────────────────────
async function boot() {
  if (!getToken()) { window.location.href = '/login.html'; return; }
  try {
    await GET('/auth/me');   // 401 → api() clears token + redirects to /login.html
  } catch (err) {
    return; // redirect already triggered
  }
  init();
}
boot();
</script>
</body>
